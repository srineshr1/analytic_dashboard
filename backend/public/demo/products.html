<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Acme Store – Products</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="/tracker.js" defer></script>
</head>
<body>
  <header>
    <span class="logo">Acme Store</span>
    <nav aria-label="Main">
      <a href="./">Home</a>
      <a href="products.html" aria-current="page">Products</a>
      <a href="checkout.html">Checkout</a>
    </nav>
  </header>
  <main>
    <h1>Products</h1>
    <div class="grid">
      <div class="card"><div class="img" aria-hidden="true">👟</div><h3>Running shoes</h3><p class="price">$79</p><button class="btn add" data-item="shoes">Add to cart</button></div>
      <div class="card"><div class="img" aria-hidden="true">🎧</div><h3>Headphones</h3><p class="price">$129</p><button class="btn add" data-item="headphones">Add to cart</button></div>
      <div class="card"><div class="img" aria-hidden="true">⌚</div><h3>Smart watch</h3><p class="price">$199</p><button class="btn add" data-item="watch">Add to cart</button></div>
      <div class="card"><div class="img" aria-hidden="true">🎒</div><h3>Backpack</h3><p class="price">$49</p><button class="btn add" data-item="backpack">Add to cart</button></div>
      <div class="card"><div class="img" aria-hidden="true">🕶️</div><h3>Sunglasses</h3><p class="price">$39</p><button class="btn add" data-item="sunglasses">Add to cart</button></div>
      <div class="card"><div class="img" aria-hidden="true">🧢</div><h3>Cap</h3><p class="price">$19</p><button class="btn add" data-item="cap">Add to cart</button></div>
    </div>
    <p style="margin-top:24px"><a class="btn" href="checkout.html" id="go-checkout">Go to checkout</a></p>
    <p id="cart-status" class="notice" role="status" hidden></p>
  </main>
  <footer>Demo site for the analytics assignment.</footer>
  <div id="debug" aria-live="polite"></div>
  <script src="demo.js" defer></script>
</body>
</html>
