<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Acme Store – Checkout</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="/tracker.js" defer></script>
</head>
<body>
  <header>
    <span class="logo">Acme Store</span>
    <nav aria-label="Main">
      <a href="./">Home</a>
      <a href="products.html">Products</a>
      <a href="checkout.html" aria-current="page">Checkout</a>
    </nav>
  </header>
  <main>
    <h1>Checkout</h1>
    <div class="card">
      <form id="checkout-form">
        <label for="name">Full name</label>
        <input id="name" name="name" autocomplete="name" required />
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required />
        <label for="address">Address</label>
        <input id="address" name="address" autocomplete="street-address" required />
        <p><button class="btn" type="submit" id="place-order">Place order</button></p>
      </form>
      <p id="order-status" class="notice" role="status" hidden>Order placed! (demo – nothing was charged)</p>
    </div>
  </main>
  <footer>Demo site for the analytics assignment.</footer>
  <div id="debug" aria-live="polite"></div>
  <script src="demo.js" defer></script>
</body>
</html>
